<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>VIZIO AI</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; width: 280px; display: flex; flex-direction: column; gap: 12px; color: #111; }
    h1 { font-size: 18px; margin: 0; font-weight: 600; }
    p { margin: 0; font-size: 14px; opacity: 0.8; }
    input { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-family: monospace; }
    button { background: #000; color: #fff; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
    button:hover { background: #333; }
    #status { font-weight: 500; font-family: monospace; padding: 10px; background: #f0f0f0; border-radius: 6px; }
    hr { width: 100%; border: 0; border-top: 1px solid #eee; margin: 10px 0; }
    .api-section { display: flex; flex-direction: column; gap: 8px; }
  </style>
</head>
<body>
  <h1>VIZIO AI</h1>
  <p>Assistente de Acessibilidade Visual</p>
  
  
  
  <div id="status">Inativo</div>
  <input type="text" id="prompt-input" placeholder="Comando (Ex: Qual o título?)" style="font-family: inherit;" />
  <button id="simulate-btn">Simular "OK, VIZIO"</button>
  
  <script src="popup.js"></script>
</body>
</html>
