<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIZIO AI — Assistente Visual</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0a0a0f;
      --surface: rgba(255,255,255,0.04);
      --surface-hover: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.08);
      --accent: #7c6af7;
      --accent-glow: rgba(124,106,247,0.35);
      --accent-2: #c084fc;
      --text-primary: #f0f0f8;
      --text-secondary: rgba(240,240,248,0.55);
      --danger: #f87171;
      --success: #34d399;
      --warn: #fbbf24;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      width: 320px;
      min-height: 420px;
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 18px;
      overflow: hidden;
      position: relative;
    }

    /* Background glow blobs */
    body::before {
      content: '';
      position: fixed;
      top: -80px;
      left: -60px;
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, rgba(124,106,247,0.18) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -60px;
      right: -60px;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(192,132,252,0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
      z-index: 1;
    }

    .logo-mark {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: white;
      box-shadow: 0 0 16px var(--accent-glow);
      flex-shrink: 0;
    }

    .header-text h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.04em;
      background: linear-gradient(90deg, var(--text-primary), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-text p {
      font-size: 11px;
      color: var(--text-secondary);
      font-weight: 400;
      margin-top: 1px;
    }

    /* Status badge */
    .status-wrap {
      position: relative;
      z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: border-color 0.3s, background 0.3s;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-secondary);
      flex-shrink: 0;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .status-dot.listening {
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
      animation: pulse-dot 1.2s ease-in-out infinite;
    }

    .status-dot.thinking {
      background: var(--warn);
      box-shadow: 0 0 8px rgba(251,191,36,0.4);
      animation: pulse-dot 0.8s ease-in-out infinite;
    }

    .status-dot.done {
      background: var(--success);
      box-shadow: 0 0 8px rgba(52,211,153,0.4);
    }

    .status-dot.error {
      background: var(--danger);
    }

    #status {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      font-family: 'Inter', monospace;
      transition: color 0.3s;
      flex: 1;
    }

    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.7; }
    }

    /* Mic button area */
    .mic-area {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 10px 0;
    }

    .mic-ring-outer {
      position: relative;
      width: 100px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Animated rings */
    .mic-ring-outer::before,
    .mic-ring-outer::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      border: 1.5px solid var(--accent);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .mic-ring-outer::before {
      width: 90px;
      height: 90px;
    }

    .mic-ring-outer::after {
      width: 110px;
      height: 110px;
    }

    .mic-ring-outer.active::before {
      opacity: 0.5;
      animation: ring-pulse 1.5s ease-out infinite;
    }

    .mic-ring-outer.active::after {
      opacity: 0.3;
      animation: ring-pulse 1.5s ease-out 0.4s infinite;
    }

    @keyframes ring-pulse {
      0% { transform: scale(0.85); opacity: 0.5; }
      100% { transform: scale(1.3); opacity: 0; }
    }

    #mic-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: linear-gradient(145deg, #1a1830, #12101f);
      box-shadow:
        0 0 0 2px var(--border),
        0 8px 32px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: transform 0.15s ease, box-shadow 0.3s;
      z-index: 1;
    }

    #mic-btn:hover {
      transform: scale(1.06);
      box-shadow:
        0 0 0 2px var(--accent),
        0 0 24px var(--accent-glow),
        0 8px 32px rgba(0,0,0,0.5);
    }

    #mic-btn:active {
      transform: scale(0.96);
    }

    #mic-btn.recording {
      background: linear-gradient(145deg, #2d1f57, #1e1440);
      box-shadow:
        0 0 0 2px var(--accent),
        0 0 32px var(--accent-glow),
        0 8px 32px rgba(0,0,0,0.5);
      animation: btn-breathe 2s ease-in-out infinite;
    }

    @keyframes btn-breathe {
      0%, 100% { box-shadow: 0 0 0 2px var(--accent), 0 0 24px var(--accent-glow), 0 8px 32px rgba(0,0,0,0.5); }
      50% { box-shadow: 0 0 0 2px var(--accent), 0 0 44px rgba(124,106,247,0.5), 0 8px 32px rgba(0,0,0,0.5); }
    }

    .mic-icon {
      transition: transform 0.2s;
    }

    #mic-btn.recording .mic-icon {
      animation: mic-wiggle 0.4s ease-in-out infinite alternate;
    }

    @keyframes mic-wiggle {
      from { transform: scaleY(1); }
      to { transform: scaleY(1.08); }
    }

    .mic-label {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 500;
      transition: color 0.3s;
    }

    .mic-label.recording {
      color: var(--accent-2);
    }

    /* Transcript box */
    .transcript-box {
      position: relative;
      z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      min-height: 44px;
      display: flex;
      align-items: center;
      transition: border-color 0.3s;
    }

    .transcript-box.active {
      border-color: rgba(124,106,247,0.35);
    }

    #transcript {
      font-size: 13px;
      color: var(--text-secondary);
      font-style: italic;
      line-height: 1.4;
      word-break: break-word;
    }

    #transcript.has-text {
      color: var(--text-primary);
      font-style: normal;
    }

    #transcript .interim {
      color: var(--text-secondary);
      font-style: italic;
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
      z-index: 1;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .divider span {
      font-size: 10px;
      color: var(--text-secondary);
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* Manual input fallback */
    .manual-section {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #prompt-input {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      width: 100%;
    }

    #prompt-input::placeholder {
      color: var(--text-secondary);
    }

    #prompt-input:focus {
      border-color: rgba(124,106,247,0.5);
      box-shadow: 0 0 0 3px rgba(124,106,247,0.1);
    }

    #send-btn {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border: none;
      border-radius: 10px;
      padding: 11px;
      color: white;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 16px var(--accent-glow);
    }

    #send-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px var(--accent-glow);
    }

    #send-btn:active {
      transform: translateY(0);
    }

    /* Footer hint */
    .footer-hint {
      position: relative;
      z-index: 1;
      text-align: center;
      font-size: 10px;
      color: var(--text-secondary);
      opacity: 0.6;
    }

    /* No speech API warning */
    #no-speech-warn {
      display: none;
      background: rgba(248,113,113,0.08);
      border: 1px solid rgba(248,113,113,0.2);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 11px;
      color: var(--danger);
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo-mark">V</div>
    <div class="header-text">
      <h1>VIZIO AI</h1>
      <p>Assistente de Acessibilidade Visual</p>
    </div>
  </div>

  <!-- Status -->
  <div class="status-wrap" id="status-wrap">
    <div class="status-dot" id="status-dot"></div>
    <span id="status">Inativo — pronto para ouvir</span>
  </div>

  <!-- Mic area -->
  <div class="mic-area">
    <div class="mic-ring-outer" id="mic-ring">
      <button id="mic-btn" aria-label="Ativar microfone">
        <svg class="mic-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="9" y="2" width="6" height="11" rx="3" fill="url(#mg)" />
          <path d="M5 11a7 7 0 0 0 14 0" stroke="url(#mg2)" stroke-width="2" stroke-linecap="round"/>
          <line x1="12" y1="18" x2="12" y2="22" stroke="url(#mg2)" stroke-width="2" stroke-linecap="round"/>
          <line x1="9" y1="22" x2="15" y2="22" stroke="url(#mg2)" stroke-width="2" stroke-linecap="round"/>
          <defs>
            <linearGradient id="mg" x1="9" y1="2" x2="15" y2="13" gradientUnits="userSpaceOnUse">
              <stop stop-color="#7c6af7"/>
              <stop offset="1" stop-color="#c084fc"/>
            </linearGradient>
            <linearGradient id="mg2" x1="5" y1="11" x2="19" y2="22" gradientUnits="userSpaceOnUse">
              <stop stop-color="#7c6af7"/>
              <stop offset="1" stop-color="#c084fc"/>
            </linearGradient>
          </defs>
        </svg>
      </button>
    </div>
    <span class="mic-label" id="mic-label">Toque para falar</span>
  </div>

  <!-- Live transcript -->
  <div class="transcript-box" id="transcript-box">
    <span id="transcript">Sua fala aparecerá aqui…</span>
  </div>

  <!-- Aviso se SpeechRecognition não disponível -->
  <div id="no-speech-warn">⚠️ Reconhecimento de voz não disponível neste navegador.</div>

  <!-- Manual input fallback -->
  <div class="divider"><span>ou digite</span></div>
  <div class="manual-section">
    <input type="text" id="prompt-input" placeholder="Ex: Qual é o título desta página?" autocomplete="off" spellcheck="false" />
    <button id="send-btn">Enviar Comando</button>
  </div>

  <p class="footer-hint">Pressione Espaço para ativar o microfone</p>

  <script src="popup.js"></script>
</body>
</html>
